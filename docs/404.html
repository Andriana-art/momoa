<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable – Momoa</title>
  <style>
    :root { --bg:#0f172a; --fg:#e2e8f0; --accent:#38bdf8; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 16px;
    }
    h1 { font-size: clamp(4rem, 20vw, 8rem); margin: 0; color: var(--accent); }
    p { font-size: 1.1rem; margin: 12px 0 28px; }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: var(--accent);
      color: var(--bg);
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Oups, cette page n'existe pas ou a été déplacée.</p>
    <a href="/momoa/" aria-label="Retour à l'accueil de MOMOA">Retour à l'accueil</a>

  </main>
</body>
</html>
